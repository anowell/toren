[workspace]
members = ["lib", "mirror", "daemon", "breq", "station"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Toren Contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
