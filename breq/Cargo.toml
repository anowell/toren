[package]
name = "breq"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "breq"
path = "src/main.rs"

[dependencies]
toren-lib = { path = "../lib" }
# The pane mirror this terminal renders; the daemon renders the same one into a browser.
toren-mirror = { path = "../mirror" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
terminal_size = "0.4"
# Raw mode for the local pane mirror; nothing else in breq touches the terminal's settings.
nix = { version = "0.29", features = ["term"] }
ureq = { version = "3", default-features = false, features = ["json"] }
dirs = "6.0.0"
which = "7"
kdl = "6.0"

[dev-dependencies]
tempfile = "3"
